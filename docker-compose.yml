name: peak-guard

x-node-service: &node-service
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: ['no-new-privileges:true']
  tmpfs: ['/tmp']
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  db:
    image: timescale/timescaledb:2.30.2-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peakguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-peakguard}
      # Small-host tuning (Raspberry Pi friendly); see docs/configuration.md
      TS_TUNE_MEMORY: ${DB_MEMORY:-1GB}
      TS_TUNE_NUM_CPUS: ${DB_CPUS:-2}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  collector:
    <<: *node-service
    image: ${IMAGE_PREFIX:-ghcr.io/tobias-nolz/peak-guard}-collector:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: collector } }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-peakguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-peakguard}
      FRONIUS_URL: ${FRONIUS_URL:?set FRONIUS_URL in .env}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}
      CLOCK_SOURCE: ${CLOCK_SOURCE:-local}
      TIME_ZONE: ${TIME_ZONE:-Europe/Vienna}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    <<: *node-service
    image: ${IMAGE_PREFIX:-ghcr.io/tobias-nolz/peak-guard}-api:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: api } }
    depends_on:
      db: { condition: service_healthy }
      collector: { condition: service_started }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-peakguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-peakguard}
      TIME_ZONE: ${TIME_ZONE:-Europe/Vienna}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-none}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-720}
      AUTH_PROXY_HEADER: ${AUTH_PROXY_HEADER:-remote-user}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/tobias-nolz/peak-guard}-web:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    read_only: true
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp', '/data', '/config']
    depends_on:
      api: { condition: service_started }
    ports:
      - '${WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3

  mock-inverter:
    <<: *node-service
    profiles: [dev]
    image: ${IMAGE_PREFIX:-ghcr.io/tobias-nolz/peak-guard}-mock-inverter:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: mock-inverter } }
    environment:
      MOCK_SPEED: ${MOCK_SPEED:-1}
      MOCK_START: ${MOCK_START:-}
      MOCK_SEED: ${MOCK_SEED:-42}
      MOCK_EV_KW: ${MOCK_EV_KW:-11}
      MOCK_PV_KWP: ${MOCK_PV_KWP:-10}
      MOCK_BATTERY_KWH: ${MOCK_BATTERY_KWH:-10.24}
    ports:
      - '127.0.0.1:${MOCK_PORT:-8090}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  backup:
    image: timescale/timescaledb:2.30.2-pg18
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-peakguard}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-peakguard}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-backups}:/backups
    healthcheck:
      # healthy while a dump newer than 2 intervals exists (first one is written on start)
      test:
        [
          'CMD-SHELL',
          'test -n "$$(find /backups -name ''peakguard-*.dump'' -mmin -$$((BACKUP_INTERVAL_HOURS * 120)))"',
        ]
      interval: 5m
      timeout: 10s
      start_period: 10m

volumes:
  db-data:
  backups:
