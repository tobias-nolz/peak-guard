name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # On push (main / tags): skip check + e2e when this exact source tree already
  # passed CI, e.g. the PR whose head became this merge/squash commit, or the
  # main commit a release tag points to. Falls back to the full run otherwise.
  gate:
    name: Already verified?
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - id: lookup
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tree() { gh api "repos/$REPO/commits/$1" --jq .commit.tree.sha; }
          want=$(tree "$SHA")
          candidates=$( (echo "$SHA"; gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].head.sha') | sort -u)
          for c in $candidates; do
            [ "$(tree "$c")" = "$want" ] || continue
            passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$c&status=success" \
              --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length")
            if [ "$passed" -gt 0 ]; then
              echo "::notice::Tree $want already passed CI (commit $c), skipping check + e2e"
              echo "verified=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "verified=false" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    services:
      timescaledb:
        image: timescale/timescaledb:2.30.2-pg18
        env:
          POSTGRES_USER: peakguard
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: peakguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peakguard" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://peakguard:ci@localhost:5432/peakguard
      - run: pnpm build

  e2e:
    name: End-to-end (compose + mock inverter)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start stack
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          POSTGRES_PASSWORD=ci
          MOCK_SPEED=30
          CLOCK_SOURCE=inverter
          POLL_INTERVAL_MS=100
          AUTH_MODE=password
          AUTH_USERNAME=e2e
          AUTH_PASSWORD=e2e-password-123
          AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret
          # control e2e: Modbus against the mock (the only device CI ever writes to)
          MODBUS_ENABLED=true
          MODBUS_HOST=mock-inverter
          MODBUS_PORT=1502
          MODBUS_POLL_MS=1000
          CONTROL_WRITES_ENABLED=true
          NOTIFY_WEBHOOK_URL=http://mock-inverter:8080/mock/webhook
          EOF
          docker compose --profile dev build
          docker compose up -d --wait db
          # 45 days of simulated history for the history views
          docker compose run --rm --no-deps collector node dist/seed-demo.js --days 45
          docker compose --profile dev up -d --wait
      - run: pnpm --filter @peak-guard/web exec playwright install --with-deps chromium
      - run: pnpm --filter @peak-guard/web e2e
        env:
          E2E_AUTH_USER: e2e
          E2E_AUTH_PASSWORD: e2e-password-123
      - if: failure()
        run: docker compose --profile dev logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report

  # Publishing only. On PRs the e2e job already builds every Dockerfile (amd64)
  # via compose, so the multi-arch build runs once, on main / tags.
  images:
    name: Build images (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [gate, check]
    if: github.event_name != 'pull_request' && !cancelled() && !failure()
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: collector, dockerfile: docker/node.Dockerfile, app: collector }
          - { image: api, dockerfile: docker/node.Dockerfile, app: api }
          - { image: mock-inverter, dockerfile: docker/node.Dockerfile, app: mock-inverter }
          - { image: web, dockerfile: docker/web.Dockerfile, app: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
